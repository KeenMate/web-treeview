<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web-treeview — Vanilla Example</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #1e293b;
        }
        h1 { font-size: 1.5rem; }
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        button {
            padding: 0.4rem 0.8rem;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        button:hover { background: #f1f5f9; }
        #output {
            margin-top: 1rem;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
            min-height: 2rem;
        }
    </style>
</head>
<body>
    <h1>&lt;web-treeview&gt; — Vanilla Example</h1>

    <div class="controls">
        <button onclick="expandAll()">Expand All</button>
        <button onclick="collapseAll()">Collapse All</button>
        <button onclick="setData()">Load Data</button>
    </div>

    <web-treeview
        id="tree"
        id-member="id"
        path-member="path"
        display-value-member="name"
        expand-level="1">
    </web-treeview>

    <div id="output">Click a node to see details here.</div>

    <!-- Import the built component -->
    <script type="module">
        import '../dist/web-treeview.js';

        const tree = document.getElementById('tree');
        const output = document.getElementById('output');

        // Sample hierarchical data
        const sampleData = [
            { id: '1',     path: '1',       name: 'Documents' },
            { id: '2',     path: '1.1',     name: 'Projects' },
            { id: '3',     path: '1.1.1',   name: 'Web App' },
            { id: '4',     path: '1.1.2',   name: 'Mobile App' },
            { id: '5',     path: '1.2',     name: 'Reports' },
            { id: '6',     path: '1.2.1',   name: 'Q1 Report' },
            { id: '7',     path: '2',       name: 'Images' },
            { id: '8',     path: '2.1',     name: 'Screenshots' },
            { id: '9',     path: '2.2',     name: 'Photos' },
        ];

        // Set initial data
        tree.data = sampleData;

        // Listen for events
        tree.addEventListener('node-clicked', (e) => {
            output.textContent = `Clicked: ${JSON.stringify(e.detail.node, null, 2)}`;
        });

        tree.addEventListener('focused-node-changed', (e) => {
            const node = e.detail.focusedNode;
            if (node) {
                output.textContent = `Focused: ${node.data?.name ?? node.path}`;
            }
        });

        // Expose helpers to window for button onclick handlers
        window.expandAll = () => tree.expandAll();
        window.collapseAll = () => tree.collapseAll();
        window.setData = () => { tree.data = sampleData; };
    </script>
</body>
</html>
