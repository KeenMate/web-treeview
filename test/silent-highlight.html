<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test — Silent Highlight Fixture</title>
    <style>
        main { padding: 1rem; font-family: sans-serif; max-width: 720px; }
        h1 { margin: 0 0 1rem; font-size: 1.2rem; }
        .tree-container { border: 1px solid #e2e8f0; padding: 0.5rem; max-width: 520px; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; }
        .readouts { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 0.75rem; margin-top: 0.75rem; font-family: monospace; font-size: 0.85rem; }
        .readouts dt { font-weight: 600; }
        .readouts dd { margin: 0; }
        /* Custom highlight class so silent path still updates the DOM. */
        :root { --test-highlight: rgb(254, 240, 138); }
        web-treeview { display: block; }
    </style>
</head>
<body>
    <main>
        <h1>Silent Highlight Fixture</h1>

        <div class="controls">
            <button data-testid="reset-counters">reset counters</button>
            <button data-testid="highlight-loud">highlightNode('1.2') loud</button>
            <button data-testid="highlight-silent">highlightNode('1.2') silent</button>
            <button data-testid="highlight-other-silent">highlightNode('2.1') silent</button>
            <button data-testid="highlight-many-loud">highlightNodes(['1.1','1.2']) loud</button>
            <button data-testid="highlight-many-silent">highlightNodes(['1.1','1.2']) silent</button>
            <button data-testid="clear-loud">clearHighlight() loud</button>
            <button data-testid="clear-silent">clearHighlight() silent</button>
            <button data-testid="deselect-loud">deselectAll() loud</button>
            <button data-testid="deselect-silent">deselectAll() silent</button>
        </div>

        <div class="tree-container">
            <web-treeview id="tree"
                expand-level="2"
                selection-mode="multi"
                show-checkboxes="true"
                highlighted-node-class="test-highlighted"></web-treeview>
        </div>

        <dl class="readouts">
            <dt>counter-click</dt><dd data-testid="counter-click">0</dd>
            <dt>counter-highlight</dt><dd data-testid="counter-highlight">0</dd>
            <dt>counter-selection</dt><dd data-testid="counter-selection">0</dd>
            <dt>last-clicked</dt><dd data-testid="last-clicked">(none)</dd>
            <dt>highlight-size</dt><dd data-testid="highlight-size">0</dd>
            <dt>highlight-paths</dt><dd data-testid="highlight-paths"></dd>
            <dt>selection-size</dt><dd data-testid="selection-size">0</dd>
        </dl>
    </main>

    <script type="module">
        import '/src/index.ts';

        const data = [
            { id: 1, path: '1', name: 'Root A' },
            { id: 11, path: '1.1', name: 'A.1' },
            { id: 12, path: '1.2', name: 'A.2' },
            { id: 2, path: '2', name: 'Root B' },
            { id: 21, path: '2.1', name: 'B.1' }
        ];

        const sortByPath = (items) =>
            [...items].sort((a, b) => a.path.localeCompare(b.path));

        function setText(id, text) {
            document.querySelector(`[data-testid="${id}"]`).textContent = text;
        }

        const counters = { click: 0, highlight: 0, selection: 0 };

        function bump(name) {
            counters[name]++;
            setText(`counter-${name}`, String(counters[name]));
        }

        customElements.whenDefined('web-treeview').then(() => {
            const tree = document.getElementById('tree');
            tree.idMember = 'id';
            tree.pathMember = 'path';
            tree.displayValueMember = 'name';
            tree.sortCallback = sortByPath;
            tree.isSorted = true;
            tree.data = data;

            tree.addEventListener('node-clicked', (e) => {
                bump('click');
                setText('last-clicked', e.detail.node.path);
            });
            tree.addEventListener('highlight-change', (e) => {
                bump('highlight');
                const paths = [...e.detail.highlightedPaths].sort();
                setText('highlight-size', String(paths.length));
                setText('highlight-paths', paths.join(','));
            });
            tree.addEventListener('selection-change', (e) => {
                bump('selection');
                setText('selection-size', String(e.detail.selectedPaths.size));
            });

            // Mirror the highlight set into the readout even when the change came
            // through the silent path (no event fires). The buttons below trigger
            // a refresh right after calling the silent API.
            function refreshHighlightReadout() {
                const paths = [...tree.getHighlightedPaths()].sort();
                setText('highlight-size', String(paths.length));
                setText('highlight-paths', paths.join(','));
            }
            function refreshSelectionReadout() {
                setText('selection-size', String(tree.getSelectedPaths().size));
            }

            const wire = (testid, fn) => {
                document.querySelector(`[data-testid="${testid}"]`).addEventListener('click', () => {
                    fn();
                    // Always refresh state readouts so silent-mode tests still see new state.
                    refreshHighlightReadout();
                    refreshSelectionReadout();
                });
            };

            wire('reset-counters', () => {
                counters.click = counters.highlight = counters.selection = 0;
                setText('counter-click', '0');
                setText('counter-highlight', '0');
                setText('counter-selection', '0');
                setText('last-clicked', '(none)');
            });

            wire('highlight-loud',         () => tree.highlightNode('1.2'));
            wire('highlight-silent',       () => tree.highlightNode('1.2', 'replace', { silent: true }));
            wire('highlight-other-silent', () => tree.highlightNode('2.1', 'replace', { silent: true }));
            wire('highlight-many-loud',    () => tree.highlightNodes(['1.1', '1.2']));
            wire('highlight-many-silent',  () => tree.highlightNodes(['1.1', '1.2'], { silent: true }));
            wire('clear-loud',             () => tree.clearHighlight());
            wire('clear-silent',           () => tree.clearHighlight({ silent: true }));
            wire('deselect-loud',          () => tree.deselectAll());
            wire('deselect-silent',        () => tree.deselectAll({ silent: true }));
        });
    </script>
    <style>
        /* Highlight class applied via highlightedNodeClass="test-highlighted". */
        web-treeview::part(node-content) {}
    </style>
</body>
</html>
